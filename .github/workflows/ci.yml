name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.crypto }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises both rustls crypto backends (default + FIPS path).
        # Windows runs the default backend only — that's the deployment target
        # we actually care about there; aws-lc-rs on Windows works in principle
        # but the extra ~5 min of build time per PR isn't justified until a
        # real customer asks for FIPS-on-Windows.
        include:
          - os: macos-latest
            crypto: crypto-ring
            cargo_args: ""
          - os: macos-latest
            crypto: crypto-aws-lc
            cargo_args: "--no-default-features --features crypto-aws-lc"
          - os: windows-latest
            crypto: crypto-ring
            cargo_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lumen-core/target
          # Cache key includes OS and backend so each variant has its own
          # bucket (avoids cross-thrashing).
          key: ${{ matrix.os }}-cargo-${{ matrix.crypto }}-${{ hashFiles('lumen-core/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-${{ matrix.crypto }}-

      - name: Run tests
        working-directory: lumen-core
        run: cargo test --all ${{ matrix.cargo_args }}
